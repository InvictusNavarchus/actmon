[package]
name = "actmon"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Linux input activity recorder for local diagnostics"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
evdev = "0.13.2"
rusqlite = { version = "0.42.0", features = ["bundled", "backup", "hooks"] }
rustix = { version = "1.1.6", features = ["event", "fs", "time", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11.1"
tempfile = "3.27"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
